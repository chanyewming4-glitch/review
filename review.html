<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>感謝您的寶貴意見</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #fdfdfd;
      color: #333;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 450px;
      margin: auto;
      border-top: 5px solid #94a3b8;
    }
    .icon { font-size: 40px; margin-bottom: 10px; }
    h3 { color: #1e293b; margin-top: 0; }
    p { font-size: 0.95rem; color: #64748b; line-height: 1.6; }

    #review-text {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      text-align: left;
      font-size: 0.9rem;
      color: #334155;
      border: 1px dashed #cbd5e1;
      white-space: pre-wrap;
    }

    button {
      background: #334155;
      color: white;
      border: none;
      padding: 16px 30px;
      border-radius: 12px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }
    button:active { transform: scale(0.98); }

    .footer-note {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">✉️</div>
  <h3>萬分抱歉</h3>
  <p>
    很遺憾未能達到您的期待。<br>
    您的意見已交由相關團隊參考，<br>
    作為我們服務改進的重要依據。
  </p>

  <div id="review-text">正在讀取回饋內容...</div>

  <button id="actionBtn">📩 提交回饋（僅內部）</button>

  <p class="footer-note">
    此回饋將僅用於內部改善<br>
    感謝您協助我們變得更好
  </p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const reviewText = params.get('msg');
  const rating = Number(params.get('rating')) || 0;

  const reviewBox = document.getElementById('review-text');
  const actionBtn = document.getElementById('actionBtn');

  reviewBox.innerText = reviewText
    ? reviewText
    : '尚未收到具體評論內容，感謝您的關注。';

  actionBtn.onclick = () => {
    alert('感謝您的回饋，我們已收到並將持續改進。');
  };
</script>

</body>
</html>
