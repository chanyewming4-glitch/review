<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>感謝您的寶貴意見</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #fdfdfd;
      color: #333;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 450px;
      margin: auto;
      border-top: 5px solid #94a3b8;
    }
    .icon { font-size: 40px; margin-bottom: 10px; }
    h3 { color: #1e293b; margin-top: 0; }
    p { font-size: 0.95rem; color: #64748b; line-height: 1.6; }

    #review-text {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      text-align: left;
      font-size: 0.9rem;
      color: #334155;
      border: 1px dashed #cbd5e1;
      white-space: pre-wrap;
    }

    button {
      background: #334155;
      color: white;
      border: none;
      padding: 16px 30px;
      border-radius: 12px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }
    button.secondary {
      background: #64748b;
      margin-top: 10px;
    }
    button:active { transform: scale(0.98); }

    .footer-note {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">✉️</div>
  <h3 id="title">感謝您的回饋</h3>

  <p id="description"></p>

  <div id="review-text">正在讀取回饋內容...</div>

  <button id="primaryBtn" style="display:none;"></button>

  <p class="footer-note" id="footerNote"></p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const rating = Math.min(Math.max(Number(params.get('rating')) || 0, 0), 5);
  const reviewText = params.get('msg') || '';

  const googleReviewUrl = 'https://openinapp.link/uc9qq'; // 🔁 換成你的 Google Review 連結

  const title = document.getElementById('title');
  const description = document.getElementById('description');
  const reviewBox = document.getElementById('review-text');
  const primaryBtn = document.getElementById('primaryBtn');
  const footerNote = document.getElementById('footerNote');

  reviewBox.innerText = reviewText || '尚未收到具體評論內容，感謝您的關注。';

  // 1–3 星（不主動引導）
  if (rating <= 3) {
    title.innerText = '感謝您的回饋';
    description.innerHTML = `
      我們已收到您的意見，<br>
      並將作為服務改善的重要參考。
    `;

    footerNote.innerHTML = `
      若您希望分享您的體驗，<br>
      也可依個人意願於 Google 評論平台留下評論
    `;
  }

  // 4–5 星（主動引導）
  if (rating >= 4) {
    title.innerText = '感謝您的肯定';
    description.innerHTML = `
      很高興這次的體驗讓您滿意，<br>
      若您願意，歡迎分享至 Google 評論。
    `;

    primaryBtn.style.display = 'block';
    primaryBtn.innerText = '📋 複製評論並前往 Google 評論';
    primaryBtn.onclick = copyAndGo;

    footerNote.innerHTML = `
      點擊按鈕後將自動複製文字，<br>
      您可直接貼上至 Google 評論
    `;
  }

  async function copyAndGo() {
    try {
      await navigator.clipboard.writeText(reviewBox.innerText);
      window.location.href = googleReviewUrl;
    } catch (err) {
      const textarea = document.createElement('textarea');
      textarea.value = reviewBox.innerText;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      window.location.href = googleReviewUrl;
    }
  }
</script>

</body>
</html>
